<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Top Pink-to-Lavender Gradient -->
    <linearGradient id="pinkLavenderGrad" x1="15%" y1="70%" x2="85%" y2="15%">
      <stop offset="0%" stopColor="#f472b6" />
      <stop offset="35%" stopColor="#e879f9" />
      <stop offset="70%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#d8b4fe" />
    </linearGradient>

    <!-- Twist Fold Shading Gradient -->
    <linearGradient id="twistFoldGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="45%" stopColor="#a855f7" />
      <stop offset="80%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>

    <!-- Bottom Cyan-to-SkyBlue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stopColor="#a5f3fc" />
      <stop offset="25%" stopColor="#38bdf8" />
      <stop offset="70%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#60a5fa" />
    </linearGradient>

    <!-- Surface Specular Light -->
    <linearGradient id="specularGleam" x1="20%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.65" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#f472b6" flood-opacity="0.3" />
    </filter>

    <!-- Orb Glow -->
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#e0f2fe" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#logoGlow)">
    <!-- 1. Bottom-Right & Bottom-Left Cyan-Blue Ribbon -->
    <path
      d="M 22 56 
         L 22 78 Q 22 84 27 87 
         L 55 103 Q 60 106 65 103 
         L 93 87 Q 98 84 98 78 
         L 98 52 
         L 81 59 
         L 81 74 Q 81 77 78 79 
         L 62 88 Q 60 89 58 88 
         L 42 79 Q 39 77 39 74 
         L 39 52 
         Z"
      fill="url(#cyanBlueGrad)"
    />

    <!-- 2. Inner Möbius Twist Transition (Top-Right Depth Facet) -->
    <path
      d="M 98 52 
         L 98 38 Q 98 34 94 32 
         L 72 20 
         L 68 38 
         L 81 59 
         Z"
      fill="url(#twistFoldGrad)"
    />

    <!-- 3. Top Pink-to-Lavender Ribbon (Outer Arch) -->
    <path
      d="M 22 56 
         L 22 38 Q 22 32 27 29 
         L 55 13 Q 60 10 65 13 
         L 94 30 Q 98 32 98 38 
         L 78 48 
         L 63 36 Q 60 35 57 36 
         L 42 45 Q 39 47 39 51 
         L 39 56 
         Z"
      fill="url(#pinkLavenderGrad)"
    />

    <!-- 4. Subtle Inner Twist Overlay (Glass Sheen) -->
    <path
      d="M 68 38 
         L 81 59 
         L 78 74 
         L 63 36 
         Z"
      fill="#ffffff"
      fillOpacity="0.12"
    />

    <!-- 5. Specular Edge Highlight on Top Ribbon -->
    <path
      d="M 27 29 
         L 55 13 Q 60 10 65 13 
         L 94 30"
      stroke="url(#specularGleam)"
      strokeWidth="2"
      strokeLinecap="round"
      fill="none"
    />

    <!-- 6. Floating Top-Right Accent Orb / Light Node -->
    <circle
      cx="98"
      cy="24"
      r="7"
      fill="#f8fafc"
      filter="url(#orbGlow)"
    />
    <circle
      cx="98"
      cy="24"
      r="4"
      fill="#ffffff"
    />
  </g>
</svg>
