services:
  - type: web
    name: omnireach-broadcast-center
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: omnireach-postgres
          property: connectionString

databases:
  - name: omnireach-postgres
    plan: starter
    region: oregon
    databaseName: BroadcastEngine
    user: omnireach_user
